databases:
  - name: escuela-postgres
    databaseName: escuela_db
    plan: free

services:
  # 1. Servicio Web Backend FastAPI
  - type: web
    name: escuela-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: escuela-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false

  # 2. Sitio Estático Frontend React SPA
  - type: web
    name: escuela-frontend
    env: static
    buildCommand: "cd frontend && npm install && CI=false npm run build"
    staticPublishPath: "./frontend/build"
    envVars:
      - key: REACT_APP_API_URL
        fromService:
          type: web
          name: escuela-backend
          property: url
